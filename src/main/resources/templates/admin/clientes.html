<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Clientes</h2>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.cedula}"></td>
                    <td th:text="${c.correo}"></td>
                    <td th:text="${c.telefono}"></td>
                    <td>
                        <span th:if="${c.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${c.activo}" class="badge bg-secondary">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/clientes/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-primary">Editar</a>

                        <form th:if="${c.activo}" th:action="@{/admin/clientes/{id}/desactivar(id=${c.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Desactivar este cliente?')">Desactivar</button>
                        </form>

                        <form th:unless="${c.activo}" th:action="@{/admin/clientes/{id}/activar(id=${c.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">Activar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="6" class="text-center text-muted">No hay clientes registrados</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
