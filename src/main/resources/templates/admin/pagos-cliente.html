<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Pagos del cliente')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="'Pagos de ' + ${cliente.nombre}">Pagos</h2>
        <a th:href="@{/admin/pagos/cliente/{clienteId}/nuevo(clienteId=${cliente.id})}"
           class="btn btn-primary">+ Registrar pago</a>
    </div>

    <p>
        <strong>Estado:</strong>
        <span th:if="${alDia}" class="badge bg-success">Al día</span>
        <span th:unless="${alDia}" class="badge bg-danger">Moroso</span>
    </p>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Fecha de pago</th>
                <th>Monto</th>
                <th>Vence</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pagos}">
                <td th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy')}"></td>
                <td th:text="'₡' + ${#numbers.formatDecimal(p.monto, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${#temporals.format(p.fechaVencimiento, 'dd/MM/yyyy')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pagos)}">
                <td colspan="3" class="text-center text-muted">Este cliente no tiene pagos registrados</td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/admin/clientes}" class="btn btn-secondary">Volver a clientes</a>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
