<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-4">Crear cuenta</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" th:field="*{nombre}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cédula</label>
                    <input type="text" th:field="*{cedula}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" th:field="*{correo}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña (mínimo 6 caracteres)</label>
                    <input type="password" th:field="*{password}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarme</button>
            </form>

            <p class="text-center mt-3"><a th:href="@{/login}">Ya tengo cuenta</a></p>
        </div>
    </div>
</div>
</body>
</html>
