<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Mis pagos')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Mis pagos</h2>

    <div th:if="${alDia}" class="alert alert-success">
        Está <strong>al día</strong>. Su membresía vence el
        <span th:text="${#temporals.format(ultimoPago.fechaVencimiento, 'dd/MM/yyyy')}"></span>.
    </div>
    <div th:unless="${alDia}" class="alert alert-danger">
        Su estado es <strong>moroso</strong>. Puede ver las clases, pero no puede matricularse
        hasta ponerse al día con el pago.
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Fecha de pago</th>
                <th>Monto</th>
                <th>Vence</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pagos}">
                <td th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy')}"></td>
                <td th:text="'₡' + ${#numbers.formatDecimal(p.monto, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${#temporals.format(p.fechaVencimiento, 'dd/MM/yyyy')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pagos)}">
                <td colspan="3" class="text-center text-muted">No tiene pagos registrados</td>
            </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
