<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Mis reservas')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Mis reservas</h2>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h4>Activas</h4>
    <table class="table table-striped table-hover align-middle mb-5">
        <thead class="table-dark">
            <tr>
                <th>Clase</th>
                <th>Entrenador</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${activas}">
                <td th:text="${r.clase.nombre}"></td>
                <td th:text="${r.clase.entrenador.nombre}"></td>
                <td th:text="${#temporals.format(r.clase.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(r.clase.fechaHoraFin, 'HH:mm')}"></td>
                <td>
                    <form th:action="@{/cliente/reservas/{id}/cancelar(id=${r.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('¿Cancelar esta reserva?')">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(activas)}">
                <td colspan="5" class="text-center text-muted">No tiene reservas activas</td>
            </tr>
        </tbody>
    </table>

    <h4>Historial</h4>
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Clase</th>
                <th>Inicio</th>
                <th>Estado</th>
                <th>Cancelada por</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${historial}">
                <td th:text="${r.clase.nombre}"></td>
                <td th:text="${#temporals.format(r.clase.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span th:if="${r.estado.name() == 'CANCELADA'}" class="badge bg-danger" th:text="${r.estado.etiqueta}"></span>
                    <span th:if="${r.estado.name() == 'ACTIVA'}" class="badge bg-secondary">Clase finalizada</span>
                </td>
                <td th:text="${r.canceladaPor}"></td>
                <td>
                    <!-- Se deja el botón para demostrar que el service rechaza (R7) -->
                    <form th:if="${r.estado.name() == 'ACTIVA'}"
                          th:action="@{/cliente/reservas/{id}/cancelar(id=${r.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(historial)}">
                <td colspan="5" class="text-center text-muted">No hay reservas en el historial</td>
            </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
