<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Clases disponibles')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h2 class="mb-4">Clases disponibles</h2>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-6 col-lg-4 mb-4" th:each="c : ${clases}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${c.nombre}">Yoga</h5>
                    <p class="card-text mb-1">
                        <strong>Entrenador:</strong> <span th:text="${c.entrenador.nombre}"></span>
                    </p>
                    <p class="card-text mb-1">
                        <strong>Fecha:</strong>
                        <span th:text="${#temporals.format(c.fechaHoraInicio, 'dd/MM/yyyy')}"></span>
                    </p>
                    <p class="card-text mb-3">
                        <strong>Horario:</strong>
                        <span th:text="${#temporals.format(c.fechaHoraInicio, 'HH:mm')}"></span> –
                        <span th:text="${#temporals.format(c.fechaHoraFin, 'HH:mm')}"></span>
                    </p>
                    <span class="badge bg-primary" th:text="'Disponibles: ' + ${c.cuposDisponibles}"></span>
                    <span class="badge bg-secondary" th:text="'Ocupados: ' + ${c.cuposOcupados}"></span>
                    <span class="badge bg-light text-dark" th:text="'Cupo: ' + ${c.cupoMaximo}"></span>
                    <span th:if="${c.finalizada}" class="badge bg-dark">Finalizada</span>
                    <span th:if="${!c.finalizada and c.cuposDisponibles <= 0}" class="badge bg-danger">Llena</span>
                </div>
                <div class="card-footer bg-white">
                    <!-- El botón siempre se muestra: las reglas las valida el service -->
                    <form th:action="@{/cliente/clases/{id}/matricular(id=${c.id})}" method="post">
                        <button type="submit" class="btn btn-primary btn-sm w-100">Matricularme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(clases)}" class="text-muted">No hay clases disponibles por ahora.</p>
</div>

<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
