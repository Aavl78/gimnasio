<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 400px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-4">Gimnasio</h3>

            <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
            <div th:if="${param.registrado}" class="alert alert-success">Cuenta creada. Ya puede iniciar sesión.</div>
            <div th:if="${param.recuperado}" class="alert alert-success">Contraseña actualizada. Ya puede iniciar sesión.</div>
Y después del </form>:
            

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <a th:href="@{/registro}">Crear cuenta</a> ·
                <a th:href="@{/recuperar}">¿Olvidó su contraseña?</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
