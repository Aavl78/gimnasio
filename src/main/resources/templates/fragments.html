<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Fragmento 1: el <head> con Bootstrap. Recibe el título de la página -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Gimnasio'">Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<!-- Fragmento 2: el menú. Muestra opciones distintas según el rol -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Gimnasio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <!-- Solo ENTRENADOR -->
                <li class="nav-item" sec:authorize="hasRole('ENTRENADOR')">
                    <a class="nav-link" th:href="@{/admin/clases}">Clases</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ENTRENADOR')">
                    <a class="nav-link" th:href="@{/admin/clientes}">Clientes</a>
                </li>
                <!-- Solo CLIENTE -->
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                    <a class="nav-link" th:href="@{/cliente/clases}">Clases disponibles</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                    <a class="nav-link" th:href="@{/cliente/perfil}">Mi perfil</a>
                </li>
            </ul>

            <span class="navbar-text me-3" sec:authentication="name">correo</span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<!-- Fragmento 3: scripts de Bootstrap (menú en celular) -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
