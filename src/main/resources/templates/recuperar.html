<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 450px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-3">Recuperar contraseña</h3>
            <p class="text-muted small">Escriba su correo y su cédula para verificar su identidad.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/recuperar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cédula</label>
                    <input type="text" name="cedula" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña (mínimo 6 caracteres)</label>
                    <input type="password" name="nuevaPassword" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
            </form>

            <p class="text-center mt-3"><a th:href="@{/login}">Volver al login</a></p>
        </div>
    </div>
</div>
</body>
</html>
