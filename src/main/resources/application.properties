spring.application.name=gimnasio

# Base de datos H2 guardada en el archivo ./data/gimnasio

spring.datasource.url=jdbc:h2:file:./data/gimnasio
spring.datasource.username=sa
spring.datasource.password=

#Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
#muestra en consola el SQL que genera
spring.jpa.show-sql=true

